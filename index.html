<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Profile</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header>
        <img src="https://via.placeholder.com/200" alt="Profile Picture" class="profile-image">
        <h1>John Doe</h1>
        <p>Full Stack Developer</p>
    </header>
    <main>
      <div class="container">
          <section class="about">
              <h2>About Me</h2>
              <p>I'm a passionate full-stack developer with 5 years of experience building web applications.</p>
          </section>
      
          <section class="skills">
              <article class="skill-item">
                  <h3>Frontend</h3>
                  <ul>
                      <li>HTML5</li>
                      <li>CSS3</li>
                      <li>JavaScript</li>
                      <li>React</li>
                  </ul>
              </article>
              <article class="skill-item">
                  <h3>Backend</h3>
                  <ul>
                      <li>Node.js</li>
                      <li>Python</li>
                      <li>Java</li>
                  </ul>
              </article>
              <article class="skill-item">
                  <h3>Databases</h3>
                  <ul>
                      <li>MySQL</li>
                      <li>MongoDB</li>
                      <li>PostgreSQL</li>
                  </ul>
              </article>
          </section>
      </div>
      
      <div class="contact-info">
          <button class="theme-toggle">Theme follows system</button>
      </div>
    </main>
</body>
</html>
